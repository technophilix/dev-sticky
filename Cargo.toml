[package]
name = "devnotes"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = "0.4.45"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sourceview5 = { version = "0.11.2", features = ["v5_10"] }
uuid = { version = "1.29.1", features = ["v4"] }
